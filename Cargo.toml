[package]
name = "prism"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = ["crates/*"]

[dependencies]
protocol = { path = "crates/protocol" }
transport = { path = "crates/transport" }
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
hostname = "0.4.2"
